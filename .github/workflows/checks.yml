# Kit checks: every pull request and every push to main runs core/run_checks.sh on
# scratch courses built from the kit (core/ci_course.sh), in Chromium, and the
# template once in WebKit (Safari's engine, not the Safari app). Feature modules are
# checked on courses of their own, in Chromium (job "modules") and in WebKit (job
# "modules-webkit", since 2026-11-03): .github/ci_plan.js picks each module
# a pull request changes, the modules that need it, and the combinations in
# features/ci-combinations.txt; every module on a push to main or a change to core/,
# template/ or .github/.
#
# A job fails on any FAIL and on any NOT RUN that is not a documented exclusion
# (listed at the top of core/ci_course.sh), so a missing Playwright, browser or
# pdfplumber fails it; a module course's job also fails unless each module's own test
# passed at least one check printed after that job's browser started. Every job blocks a merge, the WebKit job too (Louis, 2026-11-02; held
# on 2026-11-03 until the WebKit failures of offline_test.js were diagnosed and fixed in pull
# request #33, then 21 of 21 repeated WebKit runs of the whole suite on main passed, run
# 41574234473). WebKit on this Linux runner is not the Safari app: an iPhone and an iPad are
# still tried by hand before BDK goes live. The results are
# visible on each pull request, and kit sessions merge only when every applicable job concluded
# "success" on the final head commit (KIT_DESIGN.md §12 decision 10; a module job the plan
# intentionally did not select is not applicable). No branch protection is set up, so GitHub
# does not enforce this.
name: Kit checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kit-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    if: false
    name: Chromium · ${{ matrix.course }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        course: [template, template-unset, medicinal-chemistry]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - name: Playwright 1.63.0, Chromium and pdfplumber 0.11.10 (the versions the cloud container has)
        run: |
          npm install -g playwright@1.63.0
          npx --yes playwright@1.63.0 install --with-deps chromium
          python -m pip install pdfplumber==0.11.10
      - name: Build the course and run every check
        run: bash core/ci_course.sh "${{ matrix.course }}" chromium

  webkit:
    name: WebKit · template
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      # The install has its own limits, apart from the checks' (review/ci/webkit-install-2026-11-06.md):
      # 21 installs took 36-110 s; in three jobs a slow mirror held it for 38 to 44 minutes. A first attempt
      # that passes 6 minutes is tried once more; a second that does too fails the job as an install
      # failure, with every check NOT RUN. The checks are never retried.
      - name: Playwright 1.63.0, WebKit and pdfplumber 0.11.10
        id: install
        timeout-minutes: 1
        continue-on-error: true
        run: |
          echo "verification only: this first attempt is held past its limit"; sleep 120
          npm install -g playwright@1.63.0
          npx --yes playwright@1.63.0 install --with-deps webkit
          python -m pip install pdfplumber==0.11.10
      - name: Playwright 1.63.0, WebKit and pdfplumber 0.11.10 (second attempt, after the first failed or passed 6 minutes)
        id: install2
        if: steps.install.outcome == 'failure'
        timeout-minutes: 6
        run: |
          # what the timed-out first attempt left: its processes, an interrupted dpkg
          sudo pkill -f 'playwright@1.63.0 install' || true
          sudo pkill -x apt-get || true
          sudo dpkg --configure -a || true
          # all three slow installs fetched only from azure.archive.ubuntu.com; when the image's own
          # mirror list names other hosts, this attempt uses them
          echo "apt mirror list:"; cat /etc/apt/apt-mirrors.txt || true
          if [ -f /etc/apt/apt-mirrors.txt ] && grep -qv 'azure\.archive\.ubuntu\.com' /etc/apt/apt-mirrors.txt; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            echo "second attempt, without azure.archive.ubuntu.com:"; cat /etc/apt/apt-mirrors.txt
          fi
          npm install -g playwright@1.63.0
          npx --yes playwright@1.63.0 install --with-deps webkit
          python -m pip install pdfplumber==0.11.10
      - name: "NOT RUN: the WebKit install failed twice, so no check ran"
        if: failure() && steps.install.outcome == 'failure' && steps.install2.outcome != 'success'
        run: |
          echo "NOT RUN: the install of Playwright, WebKit and pdfplumber failed or passed 6 minutes twice; no check ran (an install failure, not a test failure)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Build the course and run every check in WebKit
        timeout-minutes: 30
        run: bash core/ci_course.sh template webkit

  coordinator:
    if: false
    # The improvement coordinator's records and logic (coordinator/README.md): lifecycle,
    # review planning, the published-content check, the dashboard. No network, no browser.
    name: Coordinator records and logic
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      - name: coordinator/coord_test.js
        run: node coordinator/coord_test.js

  plan:
    if: false
    name: Modules to check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      courses: ${{ steps.plan.outputs.courses }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        name: The module courses this run checks
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node .github/ci_plan.js "$EVENT" "$BASE" >> "$GITHUB_OUTPUT"

  modules:
    if: false
    name: Chromium · ${{ matrix.course }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        course: ${{ fromJSON(needs.plan.outputs.courses) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - name: Playwright 1.63.0, Chromium and pdfplumber 0.11.10 (the versions the cloud container has)
        run: |
          npm install -g playwright@1.63.0
          npx --yes playwright@1.63.0 install --with-deps chromium
          python -m pip install pdfplumber==0.11.10
      - name: Switch the modules on in a template course and run every check
        env:
          COURSE: ${{ matrix.course }}
        run: bash core/ci_course.sh "$COURSE" chromium

  # Each module course the plan selects, in WebKit too (Louis, 2026-11-03: "Yes, build the
  # additional job"; KIT_DESIGN.md §12 decision 10, Claude's reading 6). ci_course.sh fails
  # the job unless each module's own test passes at least one check printed after WebKit
  # started.
  modules-webkit:
    name: WebKit · ${{ matrix.course }} (forced, both attempts)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        course: ['module:formulas-in-text']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      # The install has its own limits, apart from the checks' (review/ci/webkit-install-2026-11-06.md):
      # 21 installs took 36-110 s; in three jobs a slow mirror held it for 38 to 44 minutes. A first attempt
      # that passes 6 minutes is tried once more; a second that does too fails the job as an install
      # failure, with every check NOT RUN. The checks are never retried.
      - name: Playwright 1.63.0, WebKit and pdfplumber 0.11.10
        id: install
        timeout-minutes: 1
        continue-on-error: true
        run: |
          echo "verification only: this first attempt is held past its limit"; sleep 120
          npm install -g playwright@1.63.0
          npx --yes playwright@1.63.0 install --with-deps webkit
          python -m pip install pdfplumber==0.11.10
      - name: Playwright 1.63.0, WebKit and pdfplumber 0.11.10 (second attempt, after the first failed or passed 6 minutes)
        id: install2
        if: steps.install.outcome == 'failure'
        timeout-minutes: 1
        run: |
          # what the timed-out first attempt left: its processes, an interrupted dpkg
          echo "verification only: this second attempt is held past its limit too"; sleep 600
          sudo pkill -f 'playwright@1.63.0 install' || true
          sudo pkill -x apt-get || true
          sudo dpkg --configure -a || true
          # all three slow installs fetched only from azure.archive.ubuntu.com; when the image's own
          # mirror list names other hosts, this attempt uses them
          echo "apt mirror list:"; cat /etc/apt/apt-mirrors.txt || true
          if [ -f /etc/apt/apt-mirrors.txt ] && grep -qv 'azure\.archive\.ubuntu\.com' /etc/apt/apt-mirrors.txt; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            echo "second attempt, without azure.archive.ubuntu.com:"; cat /etc/apt/apt-mirrors.txt
          fi
          npm install -g playwright@1.63.0
          npx --yes playwright@1.63.0 install --with-deps webkit
          python -m pip install pdfplumber==0.11.10
      - name: "NOT RUN: the WebKit install failed twice, so no check ran"
        if: failure() && steps.install.outcome == 'failure' && steps.install2.outcome != 'success'
        run: |
          echo "NOT RUN: the install of Playwright, WebKit and pdfplumber failed or passed 6 minutes twice; no check ran (an install failure, not a test failure)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Switch the modules on in a template course and run every check in WebKit
        timeout-minutes: 30
        env:
          COURSE: ${{ matrix.course }}
        run: bash core/ci_course.sh "$COURSE" webkit
