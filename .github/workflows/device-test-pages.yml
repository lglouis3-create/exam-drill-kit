# The IndexedDB device-test page (review/idb-investigation/proto/manual.html) on the kit
# repository's GitHub Pages site, for the iPhone and iPad steps in SAFARI_CHECKLIST.md.
# Investigation only; not a kit check. It runs only when started by hand (Actions, "Device
# test page", Run workflow), and publishes nothing until Louis has set the repository's Pages
# source to "GitHub Actions" (Settings, Pages). It publishes exactly one file: that page, as
# index.html. Louis asked for this on 2026-11-05; publishing waits for his yes.
name: Device test page

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-test-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the device test page
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: The one file to publish
        run: |
          mkdir -p _device-test
          cp review/idb-investigation/proto/manual.html _device-test/index.html
          ls -la _device-test
          sha256sum _device-test/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _device-test
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
